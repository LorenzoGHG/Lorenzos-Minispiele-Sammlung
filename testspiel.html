<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>iPad Mini-Spiel</title>
  <style>
    body { margin: 0; background: #1e1e2e; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; touch-action: manipulation; }
    #score { font-size: 32px; margin-bottom: 20px; }
    #target { width: 80px; height: 80px; background: #ff5555; border-radius: 50%; position: absolute; cursor: pointer; }
  </style>
</head>
<body>
  <div id="score">Punkte: 0</div>
  <div id="target"></div>

  <script>
    let score = 0;
    const target = document.getElementById('target');
    const scoreDisplay = document.getElementById('score');

    function moveTarget() {
      const x = Math.random() * (window.innerWidth - 100) + 10;
      const y = Math.random() * (window.innerHeight - 100) + 10;
      target.style.left = x + 'px';
      target.style.top = y + 'px';
    }

    target.addEventListener('pointerdown', () => {
      score++;
      scoreDisplay.textContent = 'Punkte: ' + score;
      moveTarget();
    });

    moveTarget();
  </script>
</body>
</html>
